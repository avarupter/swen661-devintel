# Accessibility pass (WCAG 2.1 AA / screen-reader requirement).
#
# Every id: matcher below is a Semantics label from lib/, which is what TalkBack
# reads aloud. Icon-only controls are the ones that matter most — with the label
# gone they become unlabelled buttons, and this flow fails.
appId: com.example.careconnect_mobile
tags:
  - accessibility
---
- launchApp:
    clearState: true

- assertVisible:
    id: "Sign in to your existing account"
- assertVisible:
    id: "Create a new account"

- runFlow: ../subflows/sign-in.yaml

- assertVisible:
    id: "Select patient role. Manage your own care."
- assertVisible:
    id: "Select caregiver role. Manage patients you care for."

- tapOn:
    id: "Select patient role. Manage your own care."

# A dose card is one sentence: medicine, dose, time of day, and its status.
- assertVisible:
    id: "Mark Lisinopril 10 mg at 8:00 AM as taken"

- tapOn: "What is this medicine for?"
# The back affordance names where back goes.
- assertVisible:
    id: "Back to my medicines"
