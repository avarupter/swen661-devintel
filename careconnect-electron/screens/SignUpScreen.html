<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>CareConnect — Create account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root{--bg:#f6f9fb;--white:#fff;--blue:#1e7cff;--blue-2:#0b63e6;--muted:#6b7a85}
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:#12202b}

      .container{max-width:1180px;margin:0 auto;padding:28px}
      header{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
      .brand{font-weight:700}
      nav a{color:var(--muted);text-decoration:none;margin-left:18px}

      .layout{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-top:28px}

      .photo{background:linear-gradient(180deg,#fff,#fbfdff);padding:18px;border-radius:18px;display:flex;align-items:center;justify-content:center}
      .photo .frame{width:100%;max-width:520px;border-radius:18px;overflow:hidden;box-shadow:0 20px 40px rgba(16,56,110,0.06)}
      .photo img{display:block;width:100%;height:100%;object-fit:cover}

      .card{background:var(--white);padding:36px;border-radius:18px;box-shadow:0 18px 40px rgba(16,56,110,0.06);border:1px solid #eef4f8}
      .back{display:inline-block;margin-bottom:6px;padding:8px;border-radius:50%;background:#f4f7fb}
      h1{margin:8px 0 6px 0;font-size:28px}
      .sub{color:var(--muted);margin-bottom:18px}

      label{display:block;font-size:13px;color:#233142;margin-bottom:8px;font-weight:600}
      .input{display:block;width:100%;padding:12px 14px;border-radius:10px;border:1px solid #e6edf3;background:#fff;color:#213243}
      .field{margin-bottom:16px}

      .btn{display:block;width:100%;padding:14px;border-radius:999px;background:linear-gradient(90deg,var(--blue) 0%,var(--blue-2)100%);color:white;text-align:center;font-weight:700;border:none;cursor:pointer;margin-top:6px}
      .muted-small{font-size:13px;color:var(--muted)}

      @media (max-width:980px){
        .layout{grid-template-columns:1fr;gap:18px}
        .container{padding:16px}
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">CareConnect</div>
      </header>

      <main class="layout">

        <div class="card">
          <a class="back" href="#">←</a>
          <h1>Create your account</h1>
          <div class="sub">Free, private, and takes under two minutes.</div>

          <form>
            <div class="field">
              <label for="name">Your name *</label>
              <input id="name" class="input" placeholder="e.g. Dorothy Smith" required />
              <div class="muted-small" style="margin-top:6px">This is how CareConnect will greet you.</div>
            </div>

            <div class="field">
              <label for="email">Email address *</label>
              <input id="email" class="input" type="email" placeholder="you@example.com" required />
            </div>

            <div class="field">
              <label for="password">Password *</label>
              <input id="password" class="input" type="password" placeholder="••••••••" required />
              <div class="muted-small" style="margin-top:6px">At least 6 characters.</div>
            </div>

            <div class="field">
              <label for="confirm">Confirm password *</label>
              <input id="confirm" class="input" type="password" placeholder="••••••••" required />
            </div>

            <button class="btn" type="submit">Create account</button>

            <div style="text-align:center;margin-top:12px"><a href="signinscreen.html" class="muted-small" style="color:var(--blue);text-decoration:none">Already have an account? Sign in</a></div>
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
