# Every patient tab opens its own screen.
appId: com.careconnectrn
tags:
  - patient
  - navigation
---
- launchApp:
    clearState: true
- runFlow: ../subflows/sign-in.yaml
- tapOn: "Select patient role, manage your own care"

- assertVisible: "Take these now"

- tapOn: "Medications"
- assertVisible: "My Medications"
- assertVisible: "Regular medicines"
# The as-needed section sits below the scheduled medicines.
- scrollUntilVisible:
    element:
      text: "Only if you need it"
    direction: DOWN

- tapOn: "Appointments"
- assertVisible: "My Appointments"
- assertVisible: "Coming up"

- tapOn: "Profile"
- assertVisible: "Sign out of your account"

- tapOn: "Today"
- assertVisible: "Today's progress"
